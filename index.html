<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dino Ultimate RPG 4.0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="crt-overlay"></div>
    <div class="vignette"></div>

    <div class="top-panel">
        <div class="hud-left">
            <div id="coins-display">🪙 0</div>
            <button id="mute-btn" class="icon-btn">🔊</button>
        </div>
        <div class="score-board">
            <span id="high-score">HI 00000</span>
            <span id="score">00000</span>
        </div>
    </div>

    <div class="game-container biome-desert" id="main-game">
        
        <div class="bg-layer bg-far"></div>
        <div class="bg-layer bg-near"></div>
        <div class="ground-line"></div>

        <!-- Комбо и Баффы -->
        <div id="combo-display" style="display:none;">COMBO x2!</div>
        <div id="active-buffs"></div>

        <!-- Питомец (Дрон) -->
        <div id="pet-drone" style="display:none;">🛸</div>

        <div class="quest-panel">
            <h4>📜 КВЕСТЫ</h4>
            <div id="quest-list"></div>
        </div>

        <div class="shop-container">
            <button id="buy-glasses-btn" class="shop-btn">
                <span class="icon">🕶️</span>
                <span class="title">Очки</span>
                <span class="price">🪙 15</span>
            </button>
            
            <button id="buy-shoes-btn" class="shop-btn">
                <span class="icon">👟</span>
                <span class="title">Кроссовки</span>
                <span class="price">🪙 30</span>
            </button>

            <button id="buy-magnet-btn" class="shop-btn">
                <span class="icon">🧲</span>
                <span class="title">Магнит</span>
                <span class="price">🪙 50</span>
            </button>

            <button id="buy-pet-btn" class="shop-btn">
                <span class="icon">🛸</span>
                <span class="title">Дрон</span>
                <span class="price">🪙 200</span>
            </button>
        </div>

        <div id="clouds"></div>
        <div id="obstacles"></div>
        <div id="coins-container"></div>
        <div id="powerups-container"></div>
        <div id="particles-container"></div>

        <div class="player" id="player-character"></div>

        <div id="game-menu">
            <h1 id="menu-title">ДИНОЗАВРИК 4.0</h1>
            <p id="menu-text">Нажмите Пробел или кнопку, чтобы начать</p>
            
            <div class="menu-actions">
                <button id="daily-btn" class="action-btn">🎁 БОНУС</button>
                <button id="skins-btn" class="action-btn">🦖 СКИНЫ</button>
                <button id="achievements-btn" class="action-btn">🏆 ДОСТИЖЕНИЯ</button>
                <a href="leaderboard.html" class="action-btn">🏆 РЕКОРДЫ</a>
            </div>

            <div class="leaderboard">
                <h3>🏆 ТОП ИГРОКОВ</h3>
                <div id="leaderboard-list">Загрузка...</div>
            </div>

            <input type="text" id="player-name-input" placeholder="Введите имя" maxlength="20" style="display: none;">
            <button id="start-btn">ИГРАТЬ</button>
        </div>

        <!-- Модалки -->
        <div id="daily-modal" class="modal" style="display: none;">
            <h2>🎁 ЕЖЕДНЕВНЫЙ БОНУС</h2>
            <p id="daily-text"></p>
            <button id="claim-daily-btn" class="action-btn">ЗАБРАТЬ</button>
            <button class="close-modal-btn">ЗАКРЫТЬ</button>
        </div>

        <div id="skins-modal" class="modal" style="display: none;">
            <h2>🦖 ВЫБОР ПЕРСОНАЖА</h2>
            <div class="skins-grid" id="skins-grid"></div>
            <button class="close-modal-btn">ЗАКРЫТЬ</button>
        </div>

        <div id="achievements-modal" class="modal" style="display: none;">
            <h2>🏆 ДОСТИЖЕНИЯ</h2>
            <div id="achievements-list" style="text-align: left; margin: 15px 0; font-size: 14px; line-height: 1.8;"></div>
            <button class="close-modal-btn">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div class="mobile-controls">
        <button id="mobile-jump-btn">⬆️</button>
        <button id="mobile-duck-btn">⬇️</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
