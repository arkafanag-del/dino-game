<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dino Ultimate RPG 6.3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="crt-overlay"></div>
    <div class="vignette"></div>

    <div class="top-panel">
        <div class="hud-left">
            <div id="coins-display">🪙 0</div>
            <div id="dna-display">🧬 0</div>
            <button id="mute-btn" class="icon-btn">🔊</button>
        </div>
        <div class="score-board">
            <span id="high-score">HI 00000</span>
            <span id="score">00000</span>
        </div>
    </div>

    <div class="game-container biome-desert" id="main-game">
        <div class="bg-hypnotic"></div>
        <div class="bg-layer bg-far"></div>
        <div class="bg-layer bg-near"></div>
        <div class="ground-line"></div>

        <div id="lives-display" style="display:none;">❤️</div>
        <div id="event-banner" style="display:none;"></div>

        <div id="boss-hp-container" style="display: none;">
            <div id="boss-name">БОСС</div>
            <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
        </div>

        <div id="combo-display" style="display:none;">COMBO x2!</div>
        <div id="active-buffs"></div>
        <div id="pet-drone" style="display:none;">🛸</div>
        <div id="pet-dog" style="display:none;">🐕</div>

        <div class="quest-panel">
            <div class="quest-title">📜 КВЕСТЫ</div>
            <div id="quest-list"></div>
        </div>

        <div id="clouds" style="z-index: 1; position: absolute; inset: 0; pointer-events: none;"></div>
        <div id="obstacles" style="z-index: 5; position: absolute; inset: 0; pointer-events: none;"></div>
        <div id="coins-container" style="z-index: 6; position: absolute; inset: 0; pointer-events: none;"></div>
        <div id="powerups-container" style="z-index: 7; position: absolute; inset: 0; pointer-events: none;"></div>
        <div id="particles-container" style="z-index: 9; position: absolute; inset: 0; pointer-events: none;"></div>
        <div id="boss-container" style="z-index: 8; position: absolute; inset: 0; pointer-events: none;"></div>

        <div class="player" id="player-character"></div>

        <div id="game-menu">
            <h1 id="menu-title">ДИНОЗАВРИК 6.3</h1>
            <p id="menu-text">Нажмите Пробел или кнопку, чтобы начать</p>
            
            <div class="menu-actions">
                <button id="daily-challenge-btn" class="action-btn" style="border-color:#ffd700; color:#ffd700;">🔥 ДЕЙЛИ</button>
                <button id="skill-btn" class="action-btn">🌳 НАВЫКИ</button>
                <button id="skins-btn" class="action-btn">🦖 КЛАССЫ</button>
                <a href="leaderboard.html" class="action-btn">🏆 РЕКОРДЫ</a>
            </div>

            <div class="checkpoint-selector">
                <span>Стартовать с:</span>
                <select id="start-biome-select">
                    <option value="0">Пустыня</option>
                    <option value="1" disabled>Джунгли</option>
                    <option value="2" disabled>Ледники</option>
                    <option value="3" disabled>Вулкан</option>
                    <option value="4" disabled>Киберпанк</option>
                </select>
            </div>

            <div class="shop-container">
                <button id="buy-glasses-btn" class="shop-btn"><span class="icon">🕶️</span><span class="title">Очки</span><span class="price">🪙 15</span></button>
                <button id="buy-shoes-btn" class="shop-btn"><span class="icon">👟</span><span class="title">Кроссовки</span><span class="price">🪙 30</span></button>
                <button id="buy-magnet-btn" class="shop-btn"><span class="icon">🧲</span><span class="title">Магнит</span><span class="price">🪙 50</span></button>
                <button id="buy-pet-btn" class="shop-btn"><span class="icon">🛸</span><span class="title">Дрон</span><span class="price">🪙 200</span></button>
                <button id="buy-dog-btn" class="shop-btn"><span class="icon">🐕</span><span class="title">Собачка</span><span class="price">🪙 300</span></button>
            </div>

            <div class="leaderboard">
                <h3>🏆 ТОП ИГРОКОВ</h3>
                <div id="leaderboard-list">Загрузка...</div>
            </div>

            <input type="text" id="player-name-input" placeholder="Введите имя для рекорда" maxlength="20" style="display: none;">
            <button id="save-record-btn" style="display: none;">💾 СОХРАНИТЬ РЕКОРД</button>
            <button id="start-btn">ИГРАТЬ</button>
        </div>

        <!-- Модалка Навыков -->
        <div id="skill-modal" class="modal" style="display: none;">
            <h2>🌳 ДРЕВО НАВЫКОВ</h2>
            <div class="skill-tree">
                <div class="skill-branch">
                    <h3>⚔️ СИЛА</h3>
                    <button class="skill-btn" data-id="f_dmg">Урон оружия x2<br><small>30 🧬</small></button>
                    <button class="skill-btn" data-id="f_hp">+1 жизнь<br><small>50 🧬</small></button>
                </div>
                <div class="skill-branch">
                    <h3>🏃 ЛОВКОСТЬ</h3>
                    <button class="skill-btn" data-id="a_jump">Прыжок +20%<br><small>30 🧬</small></button>
                    <button class="skill-btn" data-id="a_magnet">Магнит x2<br><small>50 🧬</small></button>
                </div>
                <div class="skill-branch">
                    <h3>🍀 УДАЧА</h3>
                    <button class="skill-btn" data-id="l_coin">Монеты x2<br><small>30 🧬</small></button>
                    <button class="skill-btn" data-id="l_event">Удача в событиях<br><small>50 🧬</small></button>
                </div>
            </div>
            <button class="close-modal-btn">ЗАКРЫТЬ</button>
        </div>

        <!-- Модалка Скинов -->
        <div id="skins-modal" class="modal" style="display: none;">
            <h2>🦖 ВЫБОР КЛАССА</h2>
            <div class="skins-grid" id="skins-grid"></div>
            <button class="close-modal-btn">ЗАКРЫТЬ</button>
        </div>

        <!-- Модалка Сюжета (НОВОЕ) -->
        <div id="story-modal" class="modal story-modal" style="display: none;">
            <h2 id="story-title">ГЛАВА 1</h2>
            <div id="story-text" class="story-text"></div>
            <button id="story-next-btn" class="action-btn" style="font-size: 14px; padding: 12px 30px; margin-top: 20px;">ВПЕРЕД ▶</button>
        </div>
    </div>

    <div class="mobile-controls">
        <button id="mobile-jump-btn">⬆️</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
