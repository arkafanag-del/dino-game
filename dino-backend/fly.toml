# fly.toml app configuration file generated for dino-game-backend-summer-tide-6155 on 2026-11-03T08:15:42+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dino-game-backend-summer-tide-6155'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  LEGACY_SAVE_ENABLED = '0'
  MIN_RUN_SECONDS = '10'
  MIN_WORLD_BOSS_DAMAGE_FOR_REWARD = '1000'
  MAX_WORLD_BOSS_DPS = '100'
  TRUST_PROXY_HEADERS = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
[mounts]
  source = "dino_data"
  destination = "/data"